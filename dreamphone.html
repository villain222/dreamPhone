<!DOCTYPE html>
<html lang="en">
<head>

    <title>Dream Phone Checklist</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: #f5f3ee; color: #1a1a1a; }
        .page { max-width: 760px; margin: 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-height: 100vh;}
        header { text-align:center; font-weight:bold; letter-spacing:2px; border-bottom:3px double #5b3a7c; padding:6px 0 8px; color:#5b3a7c;}
        h2 { margin:4px 0 2px; font-size:1.0rem; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #5b3a7c; padding-bottom:2px; }
        .grid { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:flex-start;}
        .col { min-width:0; }
        ul.checks { list-style:none; margin:2px 0; padding-left:2px; font-size:.95rem; line-height:1.7;}
        li label { display:inline-flex; gap:4px; align-items:center; cursor:pointer; white-space:nowrap;}
        input[type=checkbox]{ accent-color:#5b3a7c; width:16px; height:16px; margin:0; }

        .row { background:white; border-radius:8px; padding:4px 6px; box-shadow:0 1px 2px rgba(0,0,0,.05); overflow:auto;}
        .two-col{ display:flex; flex-wrap:wrap; gap:8px;}
        .section { background:white; border-radius:8px; padding:4px 6px; box-shadow:0 1px 2px rgba(0,0,0,.05);}

        table.admirer { width:100%; border-collapse:collapse; margin-top:2px;}
        .admirer th{ font-size:.78rem; text-transform:uppercase; letter-spacing:1px; padding:4px 6px; background:#ece3f5; color:#3b2a55; }
        table.admirer td{ vertical-align:top; border-left:1px solid #e0d9ea;}
        .admirer ul.checks li label { font-size:.85rem; line-height:1.6;}

        .btn-clear{ margin-top:4px; padding:8px 12px; background:#5b3a7c; color:white; border:none; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; letter-spacing:.5px; }
        .btn-clear:hover { background:#4a2f66; }

        @media (max-width: 520px){ ul.checks{font-size:.9rem} .admirer td{padding-left:3px;} h2{font-size:.85rem}}
    </style>
</head>

<script>
(function(){
    // Collect all checkboxes and save state in localStorage keyed by name+value.
    const STORAGE_KEY = "dreamphone_checklist_v1";
    let savedState;
    
    function loadState(){
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
        } catch(e){}
        return {};
    }

    function saveState(stateObj){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stateObj)); }catch(e){}
    }

    const boxes = Array.from(document.querySelectorAll('input[type=checkbox]'));
    
    // Load saved state on start.
    loaded = loadState();
    for (const b of boxes) {
        const key = b.name + "|" + b.value;
        if (loaded[key]) b.checked = true;
    }

    function currentMap(){
        const m = {};
        for(const b of boxes){
            m[b.name + "|" + b.value] = b.checked ? 1 : 0;
        }
        return m;
    }

    // Save on change.
    document.addEventListener('change', (e)=>{
        if(e.target && e.target.type === 'checkbox'){
            saveState(currentMap());
        }
    });

    // Clear button with confirmation.
    const clearBtn = document.getElementById('clearBtn');
    clearBtn.addEventListener('click', ()=>{
        if(confirm("Are you sure? This will clear all checked items.")){
            for(const b of boxes) b.checked = false;
            saveState({});
            localStorage.removeItem(STORAGE_KEY);
        }
    });

})();
</script>

</html>
